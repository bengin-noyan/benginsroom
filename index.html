<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>benginsroom</title>
    <meta name="description" content="Bengin Noyan'ın etkileşimli 3B odası: kitaplıkta hakkımda, bilgisayarda projelerim, plak çalarda klasik müzik. Etrafına bak, merak ettiğine dokun." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
    <!-- JS'ten import edilirse stil, three.js yüklenene kadar gecikir ve sayfa stilsiz görünür -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="tooltip" class="tooltip" hidden></div>

    <div id="intro" class="intro">
      <div class="intro-card">
        <h1>benginsroom</h1>
        <p>Hoş geldin, içeri gel.<br />Kitaplıkta hikâyem, bilgisayarda projelerim, plak çalarda biraz müzik var.<br />Etrafına bak, merak ettiğine dokun.</p>
        <button id="enter" type="button">Odaya gir</button>
      </div>
    </div>

    <button id="back" class="back" type="button" hidden>← Odaya dön <kbd>Esc</kbd></button>
    <nav id="dock" class="dock" aria-label="Odadaki eşyalar"></nav>
    <div id="hint" class="hint">Sürükle: etrafına bak · Tekerlek: yaklaş · Tıkla: eşyayı kullan</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
